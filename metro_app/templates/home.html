{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="row align-items-center">
        <!-- Фото слева -->
        <div class="col-auto">
            {% if user.photo %}
                <img src="{{ user.photo.url }}" alt="Фото" class="rounded-circle" style="width: 150px; height: 150px; object-fit: cover;">
            {% else %}
                <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 150px; height: 150px;">
                    <i class="bi bi-person-fill text-white" style="font-size: 50px;"></i>
                </div>
            {% endif %}
        </div>

        <!-- ФИО справа -->
        <div class="col">
            <h3>ФИО: {{ user.full_name }}</h3>
        </div>
    </div>
</div>
{% endblock %}
