<!DOCTYPE html>
<html lang="ru">
<head>
    <style>
        .nav-link.active {
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            color: #000 !important;
        }
    </style>
    <meta charset="UTF-8">
    <title>ГУП Московский метрополитен</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% load static %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
        <a class="navbar-brand d-flex align-items-center me-4" href="{% url 'home' %}">
            <img src="{% static 'img/logo.gif' %}" alt="Логотип" style="height: 40px;">
        </a>
        <div class="navbar-nav d-flex flex-row">
            <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">Главная</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'post_list' %}active{% endif %}" href="{% url 'post_list' %}">Посты</a>
            <a class="nav-link {% if request.resolver_match.url_name == 'user_list' %}active{% endif %}" href="{% url 'user_list' %}">Пользователи</a>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Модальное окно -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">ЛИЧНАЯ КАРТОЧКА</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    Загрузка...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    <button type="button" class="btn btn-primary">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function showUserModal(userId) {
            const res = await fetch(`/api/users/${userId}/`);
            const user = await res.json();
            document.getElementById('modalBody').innerHTML = `
                <p><strong>ФИО:</strong> ${user.full_name}</p>
                <p><strong>Email:</strong> ${user.email}</p>
                <p><strong>Адрес:</strong> ${user.address || 'Не указан'}</p>
            `;
            const modal = new bootstrap.Modal(document.getElementById('userModal'));
            modal.show();
        }
    </script>
</body>
</html>
